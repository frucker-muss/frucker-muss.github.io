{% if layout.name == 'cronica' or page.layout == 'cronica' %}
  <link rel="stylesheet" href="{{ '/assets/css/cronica.css' | relative_url }}">
{% endif %}---
layout: default
---
<article class="cronica">
  <header class="cronica-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="cronica-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="cronica-body">
    {{ content }}
  </div>
</article>
