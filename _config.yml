title: Rücker · Musskopf
description: Família
lang: pt-BR
url: "https://rucker.life"

# Único canal de contato/contribuição do acervo
contato_email: acervorucker@gmail.com

# Identidade visual — textos do cabeçalho, rodapé e home (um lugar só)
marca: "Rücker.life"
marca_linha: "Genealogia · História · Memória"
palavras_pano: ["Histórias", "Família", "Memória", "Devaneios"]
frase_faixa: "Memórias não são apenas lembranças,<br>mas pontes entre o que fomos e o que ainda podemos compreender."
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap

# Documentos internos do projeto (guias para IA, relatórios, snapshots, conversas) —
# não são conteúdo público e não devem ser publicados nem indexados.
# (mantém também a lista padrão de exclusão do Jekyll, que este campo substitui por completo)
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - AGENTS.md
  - GUIA-PROCESSO-FOTOS-ACERVO.md
  - RELATORIO_FASE0.md
  - SITE_SNAPSHOT.md
  - _notas/
  - "*.patch"

# Remova ou comente a linha abaixo para evitar sobreposição de estilos
# theme: jekyll-theme-architect

# Cor de acento por pasta (bronze = Rücker, salvia-escura = Musskopf)
defaults:
  - scope: { path: "familia" }
    values: { acento: bronze }
  - scope: { path: "musskopf" }
    values: { acento: salvia-escura }
